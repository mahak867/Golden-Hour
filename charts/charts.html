<style>

body { margin: 0; background: #0d1530; font-family: "Inter", "Segoe UI", system-ui, sans-serif; color: var(--text); }
.fig { display: inline-block; padding: 0; }
svg text { font-family: "Inter", "Segoe UI", system-ui, sans-serif; }

.val { font-size: 15px; fill: var(--text); font-weight: 700; }
.note { font-size: 12.5px; fill: var(--text-2); }
.src { font-size: 10.5px; fill: var(--muted); }
.ax { font-size: 11.5px; fill: var(--muted); }

.box { fill: #18223d; stroke: #3a4766; stroke-width: 1.5; }

.rail { fill: #1b1f2c; stroke: #3a4058; stroke-dasharray: 4 3; }
.rt { font-size: 11.5px; fill: var(--text-2); font-weight: 600; }
.arrow { stroke: #8b95ae; stroke-width: 1.8; fill: none; marker-end: url(#ah); }

<script>
